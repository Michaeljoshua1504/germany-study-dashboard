name: Update Supabase Content

on:
  push:
    branches: [main]
    paths:
      - supabase/update.sql

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute SQL via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 -c "import json,urllib.request; sql=open('supabase/update.sql').read(); req=urllib.request.Request('https://api.supabase.com/v1/projects/epndekpwxngjozytlcmy/database/query',data=json.dumps({'query':sql}).encode(),headers={'Authorization':'Bearer $SUPABASE_ACCESS_TOKEN','Content-Type':'application/json'},method='POST'); resp=urllib.request.urlopen(req).read().decode(); print(resp); open('supabase/query_result.json','w').write(resp)"

      - name: Commit query result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/query_result.json
          git diff --cached --quiet || git commit -m "Auto: query result [skip ci]"
          git push
