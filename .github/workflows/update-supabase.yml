name: Update Supabase Content

on:
  push:
    branches: [main]
    paths:
      - supabase/update.sql

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute SQL via Supabase Management API
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/epndekpwxngjozytlcmy/database/query" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(python3 -c "import json; print(json.dumps(open('supabase/update.sql').read()))")}")
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    if isinstance(d, dict) and 'message' in d:
        print('ERROR:', d)
        sys.exit(1)
    else:
        print('Success!')
except:
    print('Done')
"
