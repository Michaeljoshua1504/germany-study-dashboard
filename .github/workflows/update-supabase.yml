name: Update Supabase Content

on:
  push:
    branches: [main]
    paths:
      - supabase/update.sql

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute SQL via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 -c "import json,urllib.request; sql=open('supabase/update.sql').read(); req=urllib.request.Request('https://api.supabase.com/v1/projects/epndekpwxngjozytlcmy/database/query',data=json.dumps({'query':sql}).encode(),headers={'Authorization':'Bearer $SUPABASE_ACCESS_TOKEN','Content-Type':'application/json'},method='POST'); print(urllib.request.urlopen(req).read().decode())"
